services:
  storage-permissions:
    image: postgres:16-alpine
    user: '0:0'
    entrypoint: ['sh', '-c', 'chown 1000:1000 /recovery /assets']
    volumes:
      - recovery_data:/recovery
      - assets_data:/assets
  db:
    image: postgres:16-alpine
    container_name: k13group_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: k13group_backend
    restart: unless-stopped
    depends_on:
      storage-permissions:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      RECOVERY_DIR: /recovery
      ASSET_DIR: /assets
      RECOVERY_SECRET: ${RECOVERY_SECRET}
    ports:
      - '3001:3001'
    volumes:
      - ./backend:/app
      - recovery_data:/recovery
      - assets_data:/assets
      - /app/node_modules
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: k13group_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  recovery:
    build: ./recovery
    restart: unless-stopped
    depends_on:
      storage-permissions:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      RECOVERY_SECRET: ${RECOVERY_SECRET}
    volumes:
      - recovery_data:/recovery
      - assets_data:/assets
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,time; assert time.time()-os.stat('/recovery/heartbeat').st_mtime<15"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  recovery_data:
  assets_data:
  postgres_data:
