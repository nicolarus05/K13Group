# Entorno local: puertos del equipo y archivos creados como el usuario de Ubuntu.
services:
  db:
    ports: !override
      - "127.0.0.1:5432:5432"
  backend:
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/docs').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    user: "1000:1000"
    environment:
      FRONTEND_URL: http://localhost:3000
    ports: !override
      - "127.0.0.1:3001:3001"
    volumes:
      - backend_node_modules:/app/node_modules
  frontend:
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    user: "1000:1000"
    ports: !override
      - "127.0.0.1:3000:3000"
    volumes:
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
volumes:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
